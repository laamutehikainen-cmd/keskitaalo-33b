hero:
  eyebrow: Vierasopas · Levi
  title: Tervetuloa tunturin rauhaan.
  subtitle: Keskitaalo 33B
  intro: >
    Täältä löydät tärkeimmät ohjeet sujuvaan oleskeluun, turvalliseen mökin käyttöön
    ja onnistuneeseen lähtöön. Tarkat avain- ja sisäänkirjautumistiedot saat aina omasta varausviestistäsi.
  primaryAction: Aloita pikaoppaasta
  secondaryAction: Tutustu Leviin
  locationLabel: 67°48′ N · Sirkka, Levi
quickTitle: Kaikki tärkeä nopeasti
quickIntro: Valitse tilanne — jokainen ohje löytyy myös alempaa yksityiskohtaisemmin.
