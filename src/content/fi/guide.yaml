sections:
  - id: parking
    number: "01"
    kicker: Pysäköinti
    title: Auto mökin edustalle
    intro: Mökin edustalla on pysäköintipaikka yhdelle autolle.
    tone: light
    items:
      - id: parking
        title: Näin pysäköit
        body: Pysäköi auto mökin edustalla olevalle sorapintaiselle paikalle.
        steps:
          - Jätä kulku mökin ovelle esteettömäksi.
          - Älä tuki ajoväylää, naapurimökkien kulkua tai pelastustietä.
          - Huomioi talvella auraus ja pidä auto selvästi pysäköintialueella.
  - id: cabin
    number: "02"
    kicker: Lämpö, ilma ja tuli
    title: Sauna ja takka turvallisesti
    intro: Koneellinen poistoilmanvaihto vaikuttaa sekä saunan kuivumiseen että takan vetoon. Lue ilmanvaihdon ja takan ohjeet yhdessä.
    tone: soft
    items:
      - id: heating
        title: Lämmitys
        body: Pidä patterit ja termostaatit normaalisti nykyisissä asetuksissaan. Älä peitä pattereita tai kuivata niiden päällä vaatteita.
      - id: ventilation
        title: Koneellinen ilmanvaihto
        body: Mökin poistoilmanvaihtoa säädetään liesikuvusta. Pidä ilmanvaihto tavallisesti perusasetuksella.
        steps:
          - Tehosta ilmanvaihtoa saunomisen ja saunan kuivumisen ajaksi.
          - Takan sytyttämisen ajaksi avaa vähintään tuuletusikkuna tai säädä liesikuvun ilmanvaihto nollalle.
          - Älä käytä voimakasta poistoa takkaa sytyttäessä, sillä alipaine voi tuoda savua sisälle.
          - Palauta ilmanvaihto normaalille perusasetukselle käytön jälkeen.
      - id: sauna
        title: Sauna
        body: Saunassa on tavallinen sähkökiuas, jossa on mekaaninen kellokytkin ja termostaatti. Käytä kiuasta vain saunomisen aikana.
        steps:
          - Tarkista ennen käynnistystä, ettei kiukaan päällä tai lähellä ole tekstiilejä tai muuta tavaraa.
          - Kierrä kellokytkimen säädin toiminta-alueelle 0–4 tuntia. Kiuas alkaa lämmetä. Älä käytä ajastettua käynnistystä tai kellokytkimen esivalinta-aluetta.
          - Säädä kiukaan lämmitystehoa termostaatilla. Jos lämpötila nousee epämiellyttävän korkeaksi, käännä termostaatin säädintä vastapäivään. Jos lämpötila jää liian matalaksi, käännä säädintä myötäpäivään.
          - Tehosta koneellista ilmanvaihtoa saunomisen ajaksi liesikuvun säätimestä.
          - Heitä vettä vain kiuaskiville maltillisesti. Älä kastele sähköosia, kellokytkintä tai termostaattia.
          - Kiuas kytkeytyy pois päältä, kun kellokoneisto palauttaa kellokytkimen säätimen 0-kohtaan. Voit sammuttaa kiukaan milloin tahansa kiertämällä säätimen käsin 0-kohtaan.
          - Varmista saunomisen jälkeen, että kellokytkin on 0-asennossa. Jätä saunan ovi raolleen kuivumisen ajaksi.
      - id: fireplace
        title: Takka, pellit ja tuhkat
        body: Valmistele ilmanvaihto ja takka ennen jokaista sytytystä. Älä jätä tulta koskaan ilman valvontaa.
        steps:
          - Poista tuhkat ennen lämmitystä vain, kun ne ovat täysin jäähtyneet. Tyhjennä tuhkat mökin edustalla olevaan metalliastiaan.
          - Avaa savupelti kokonaan ennen sytyttämistä.
          - Avaa sytyttämisen ajaksi vähintään tuuletusikkuna tai säädä liesikuvun ilmanvaihto nollalle.
          - Käytä vain mökille varattuja kuivia polttopuita, polta maltillinen pesällinen ja pidä takan luukku suljettuna.
          - Älä sulje peltiä missään tilanteessa, jos takassa on vielä palavaa, hehkuvaa tai kytevää ainesta. Sulje pelti vasta, kun tuli ja hiillos ovat varmasti täysin sammuneet.
          - Älä koskaan siirrä kuumaa tuhkaa tai kekäleitä metalliastiaan.
  - id: appliances
    number: "03"
    kicker: Kodinkoneet
    title: Kuivaus ja pesu
    intro: Käytä laitteita vain mökillä ollessasi. Valitse ohjelma tekstiilin, astioiden tai pyykin tarpeen mukaan.
    tone: light
    items:
      - id: drying-cabinet
        title: Kuivauskaappi
        body: Tarkista tekstiilien pesu- ja kuivausmerkinnät ennen kuivauskaapin käyttöä.
        steps:
          - Ravistele märät vaatteet ja ripusta ne väljästi niin, että ilma pääsee kiertämään.
          - Älä kuivaa kaapissa öljyn, polttoaineen tai muiden helposti syttyvien aineiden likaamia tekstiilejä.
          - Sulje ovet, valitse paneelista maltillinen lämpö ja sopiva kuivausaika.
          - Sammuta kaappi käytön jälkeen äläkä jätä sitä käyntiin mökiltä poistuessasi.
      - id: dishwasher
        title: Astianpesukone
        body: Poista ruoantähteet astioista ja varmista ennen käynnistystä, että suihkuvarret pääsevät pyörimään.
        steps:
          - Lataa astiat niin, etteivät ne estä koneen varsia tai pesuainelokeron avautumista.
          - Käytä vain astianpesukoneeseen tarkoitettua pesuainetta. Älä käytä käsitiskiainetta.
          - Valitse tavallinen pesuohjelma ja käynnistä kone vasta, kun luukku on kunnolla suljettu.
          - Käytä konetta vain mökillä ollessasi ja jätä puhdas kone hieman raolleen käytön jälkeen.
      - id: washing-machine
        title: Pyykinpesukone
        body: Tarkista taskut, sulje vetoketjut ja noudata tekstiilien pesumerkintöjä.
        steps:
          - Älä ylitäytä rumpua ja käytä pyykinpesukoneeseen tarkoitettua pesuainetta oikeassa lokerossa.
          - Valitse tekstiileille sopiva ohjelma ja lämpötila.
          - Varmista, että luukku on suljettu ennen käynnistystä. Älä pakota lukittua luukkua auki.
          - Käytä konetta vain mökillä ollessasi ja jätä luukku pesun jälkeen raolleen kuivumista varten.
  - id: rules
    number: "04"
    kicker: Yhteinen rauha
    title: Pidetään mökistä ja luonnosta huolta
    intro: Huomioi naapurit, mökki ja ympäröivä luonto koko vierailun ajan.
    tone: soft
    items:
      - id: neighbours
        title: Naapurit ja äänet
        body: Kunnioita alueen rauhaa ja pidä etenkin ilta- ja yöaikaan musiikki sekä keskustelu sisätiloihin sopivalla tasolla.
      - id: smoking
        title: Tupakointi
        body: Tupakointi mökin sisätiloissa on kielletty.
      - id: outdoors
        title: Luonto ja piha
        body: Älä jätä roskia luontoon. Avotulta saa tehdä vain sallituilla paikoilla ja ainoastaan silloin, kun voimassa ei ole metsä- tai ruohikkopalovaroitusta.
  - id: departure
    number: "05"
    kicker: Ennen lähtöä
    title: Jätä mökki hyvään kuntoon
    intro: Noudata varauksessa ilmoitettua uloskirjautumisaikaa ja tee ennen lähtöä nämä muutamat asiat.
    tone: dark
    items:
      - id: kitchen
        title: Keittiö
        body: Pese astiat tai käynnistä astianpesukone hyvissä ajoin ennen lähtöä. Älä jätä konetta käyntiin mökin jäädessä tyhjäksi. Tyhjennä omat ruoat ja pyyhi näkyvät roiskeet.
      - id: waste
        title: Roskat
        body: Lajittele ja vie roskat niille tarkoitettuihin jäteastioihin ennen lähtöä. Älä jätä roskia mökkiin tai pihalle.
      - id: final-check
        title: Viimeinen kierros
        body: Sammuta valot ja sähkölaitteet, sulje ikkunat sekä vesihanat ja varmista, että kiuas on pois päältä. Takkaan ei saa jäädä tulta tai kytevää hiillosta, eikä peltiä saa sulkea palamisen aikana.
      - id: key
        title: Avaimet ja lukitus
        body: Ulko-oven vieressä sijaitsevan numerokoodillisen avainlaatikon avainta käytetään vain sisäänpääsyyn ja oven lukitsemiseen lähtiessä. Palauta se jokaisen käyttökerran jälkeen avainlaatikkoon. Käytä vierailun aikana ruokapöydältä löytyvää avainta.
        steps:
          - Saapuessasi avaa ulko-ovi avainlaatikon avaimella ja palauta avain heti takaisin laatikkoon.
          - Sulje avainlaatikko, sekoita numerot ja varmista kevyesti vetämällä, että laatikko on lukossa.
          - Käytä vierailun aikana ruokapöydällä olevaa avainta.
          - Lähtiessäsi jätä käytössä ollut avain takaisin ruokapöydälle.
          - Ota lähtiessäsi avainlaatikon avain, lukitse sillä ulko-ovi ja palauta avain heti laatikkoon. Varmista vielä, että laatikko lukittui.
emergency:
  eyebrow: Hätätilanne
  title: Toimi ensin, ilmoita sitten
  number: "112"
  body: Soita 112 vain todellisessa hätätilanteessa, kun henki, terveys, omaisuus tai ympäristö on vaarassa.
  addressLabel: Mökin osoite
  address: Keskitaalo 33B, 99130 Sirkka
  steps:
    - Kerro mitä on tapahtunut ja ilmoita mökin osoite.
    - Vastaa kysymyksiin ja noudata hätäkeskuksen ohjeita.
    - Älä katkaise puhelua ennen kuin saat luvan.
  sourceLabel: Virallinen 112-ohje
  sourceHref: https://www.suomi.fi/kansalaiselle/oikeudet-ja-osallistuminen-yhteiskuntaan/hatatilanteet-ja-turvallisuus/opas/nain-toimit-hatatilanteissa/hatatilanteessa-soita-112
contact:
  eyebrow: Tarvitsetko apua?
  title: Majoittaja auttaa varauskanavassa
  body: Kiireettömissä mökkiä, laitteita tai majoitusta koskevissa kysymyksissä lähetä viesti sen palvelun kautta, jossa varaus tehtiin.
  note: Hätätilanteessa soita aina ensin 112.
