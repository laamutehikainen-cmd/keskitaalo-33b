nature:
  eyebrow: Safe in nature
  title: The fell rewards preparation
  intro: A little planning makes every trip more relaxed and helps keep northern nature beautiful.
  items:
    - id: route
      title: Plan your route
      body: Choose a route suitable for your group, tell someone your plan and carry a power bank or paper map alongside digital navigation.
    - id: weather
      title: Check weather and warnings
      body: Dress in layers and prepare for change. Check forest and grass fire warnings before making any fire.
      href: https://en.ilmatieteenlaitos.fi/warnings
      linkLabel: Finnish Meteorological Institute warnings
    - id: trace
      title: Leave no trace
      body: Stay on marked routes, keep your distance from animals and carry all litter out of nature.
footer:
