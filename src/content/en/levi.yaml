hero:
  eyebrow: The fell in every season
  title: Levi begins where the rush ends.
  intro: >
    Forest trails, fell landscapes and the services of Sirkka belong to the same holiday.
    Find timeless ideas here, with direct links to information that stays current.
  backLabel: Back to the cabin guide
seasonsTitle: Four ways to experience the north
seasonsIntro: Weather and seasons change quickly. Always check current trail, lift and service conditions from official sources before setting out.
seasons:
  - id: winter
    number: "01"
    title: Winter
    body: Skiing, cross-country trails, winter walks and northern-light evenings bring brightness to the polar night. Dress in layers and keep your phone warm.
    accent: snow
  - id: spring
    number: "02"
    title: Spring snow
    body: Long days and firm snow invite you outdoors. Sunglasses, water and a current route map belong in every pack.
    accent: sun
  - id: summer
    number: "03"
    title: Summer and autumn
    body: Hike, cycle and enjoy the midnight sun or autumn colours. The weather can turn quickly even on a warm day.
    accent: ember
  - id: night
    number: "04"
    title: A quiet evening
    body: Sometimes the best of Levi is found in the nearby forest, the warmth of the sauna and the moment the sky opens above the fell.
    accent: night
linksTitle: Current Levi information in your pocket
