sections:
  - id: parking
    number: "01"
    kicker: Parking
    title: Park in front of the cabin
    intro: There is one parking space directly in front of the cabin.
    tone: light
    items:
      - id: parking
        title: Where to park
        body: Park on the gravel area directly in front of the cabin.
        steps:
          - Keep the route to the cabin door clear.
          - Do not block the driveway, access to neighbouring cabins or the emergency route.
          - In winter, leave room for snow clearing and keep the car clearly within the parking area.
  - id: cabin
    number: "02"
    kicker: Warmth, air and fire
    title: Use the sauna and fireplace safely
    intro: The mechanical extract ventilation affects both sauna drying and fireplace draught. Read the ventilation and fireplace guidance together.
    tone: soft
    items:
      - id: heating
        title: Heating
        body: Normally, leave radiators and thermostats at their current settings. Never cover radiators or dry clothes on them.
      - id: ventilation
        title: Mechanical ventilation
        body: The cabin's extract ventilation is controlled from the cooker hood. Normally, keep it at its basic setting.
        steps:
          - Increase ventilation while using the sauna and while the sauna is drying.
          - When lighting the fireplace, open at least one ventilation window or set the cooker hood ventilation to zero.
          - Do not use strong extraction while lighting the fireplace, as negative pressure may draw smoke indoors.
          - Return ventilation to its normal basic setting afterwards.
      - id: sauna
        title: Sauna
        body: The sauna has a standard electric heater with a mechanical timer switch and thermostat. Operate the heater only while using the sauna.
        steps:
          - Before switching it on, make sure there are no textiles or other items on or close to the heater.
          - Turn the timer switch to the 0–4 hour operating range. The heater starts heating. Do not use delayed starting or the timer's preset range.
          - Adjust the heater output with the thermostat. If the sauna becomes uncomfortably hot, turn the thermostat control counterclockwise. If the temperature remains too low, turn it clockwise.
          - Increase the mechanical ventilation from the cooker hood control while using the sauna.
          - Pour water moderately and only onto the sauna stones. Keep water away from electrical parts, the timer switch and the thermostat.
          - The heater switches off when the timer mechanism returns the timer switch to 0. You can switch it off at any time by turning the timer control manually to 0.
          - After using the sauna, you may leave the heater on for about 30 minutes to help the sauna dry. Keep the sauna door closed so moisture does not move into the washroom, and keep the ventilation boosted while the sauna dries.
          - After drying, make sure the timer switch is at 0 and the heater is off. Never leave the heater on when leaving the cabin.
      - id: fireplace
        title: Fireplace, damper and ashes
        body: Prepare the ventilation and fireplace before every fire. Never leave a fire unattended.
        steps:
          - Remove ashes before heating only when they are completely cool. Empty them into the metal container in front of the cabin.
          - Open the chimney damper fully before lighting the fire.
          - While lighting, open at least one ventilation window or set the cooker hood ventilation to zero.
          - Use only the dry firewood provided, burn a moderate load and keep the fireplace door closed.
          - Never close the damper while anything in the fireplace is burning, glowing or smouldering. Close it only after the fire and embers are completely out.
          - Never move hot ashes or embers into the metal container.
  - id: appliances
    number: "03"
    kicker: Appliances
    title: Drying and washing
    intro: Operate appliances only while you are at the cabin. Choose a programme suitable for the textiles, dishes or laundry.
    tone: light
    items:
      - id: drying-cabinet
        title: Drying cabinet
        body: Check each garment's care label before using the drying cabinet.
        steps:
          - Hang wet clothes loosely so air can circulate.
          - Never dry textiles contaminated with oil, fuel or other flammable substances.
          - Close the doors and select a moderate temperature and suitable drying time from the panel.
          - Switch the cabinet off after use and never leave it running when you leave the cabin.
      - id: dishwasher
        title: Dishwasher
        body: Remove food scraps and make sure the spray arms can rotate freely before starting the machine.
        steps:
          - Load dishes so they do not block the spray arms or detergent compartment.
          - Use dishwasher detergent only. Never use washing-up liquid intended for hand washing.
          - Choose a normal wash programme and start only after the door is properly closed.
          - Run the machine only while you are at the cabin and leave the clean machine slightly open afterwards.
      - id: washing-machine
        title: Washing machine
        body: Empty pockets, close zips and follow each textile's care label.
        steps:
          - Do not overload the drum. Use washing-machine detergent in the correct compartment.
          - Choose a programme and temperature suitable for the textiles.
          - Make sure the door is closed before starting. Never force open a locked door.
          - Run the machine only while you are at the cabin and leave the door ajar after washing so it can dry.
  - id: rules
    number: "04"
    kicker: Shared peace
    title: Care for the cabin and the surrounding nature
    intro: Be considerate of the neighbours, the cabin and the surrounding nature throughout your stay.
    tone: soft
    items:
      - id: neighbours
        title: Neighbours and noise
        body: Respect the calm of the area. Keep music at a considerate indoor level, especially during the evening and night.
      - id: smoking
        title: Smoking
        body: Smoking inside the cabin is prohibited.
      - id: outdoors
        title: Nature and the yard
        body: Leave no litter outdoors. Make a fire only at designated sites and never when a forest or grass fire warning is in effect.
  - id: departure
    number: "05"
    kicker: Before departure
    title: Leave the cabin in good condition
    intro: Check out by the time shown in your reservation and complete these few tasks before leaving.
    tone: dark
    items:
      - id: kitchen
        title: Kitchen
        body: Wash the dishes or start the dishwasher well before departure. Do not leave it running when the cabin is empty. Remove your own food and wipe away visible spills.
      - id: waste
        title: Waste
        body: Sort and take rubbish to the designated bins before departure. Do not leave rubbish inside the cabin or outdoors.
      - id: final-check
        title: Final check
        body: Switch off lights and appliances, close windows and taps, and make sure the sauna heater is off. No fire or smouldering embers may remain in the fireplace, and the damper must not be closed while combustion continues.
      - id: key
        title: Keys and locking up
        body: Use the key in the coded lockbox beside the front door only to enter the cabin and to lock the door when leaving. Return it to the lockbox immediately after each use. During your stay, use the cabin key found on the dining table.
        steps:
          - On arrival, unlock the front door with the lockbox key and return it to the lockbox immediately.
          - Close the lockbox, scramble the code and pull it gently to make sure it is locked.
          - Use the key found on the dining table during your stay.
          - Before departure, return the key you have been using to the dining table.
          - On departure, take the lockbox key, lock the front door and return the key to the box immediately. Make sure the box is securely locked.
emergency:
  eyebrow: Emergency
  title: Act first, notify afterwards
  number: "112"
  body: Call 112 only in a real emergency when life, health, property or the environment is in danger.
  addressLabel: Cabin address
  address: Keskitaalo 33B, 99130 Sirkka
  steps:
    - Explain what has happened and give the cabin address.
    - Answer the operator's questions and follow their instructions.
    - Do not end the call until you are told to do so.
  sourceLabel: Official 112 guidance
  sourceHref: https://www.suomi.fi/citizen/rights-and-obligations/emergencies-and-security/guide/what-to-do-in-an-emergency/call-112-in-an-emergency
contact:
  eyebrow: Need help?
  title: Your host is available through the booking platform
  body: For non-urgent questions about the cabin, its appliances or your stay, send a message through the service where you made the booking.
  note: In an emergency, always call 112 first.
